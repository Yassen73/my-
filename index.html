<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كتابك — مصنع الكتب</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f3d4a;--navy2:#176074;--gold:#d99a1f;--desk:#f3eee4;--ink:#1f2630;--line:#e3dac8;--card:#fffdf9;--mut:#6b7280}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.7 Tajawal,sans-serif}
header{background:linear-gradient(135deg,#0b2f39,var(--navy2));color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:5;flex-wrap:wrap;box-shadow:0 2px 12px #0003}
.brand{font:700 28px 'Reem Kufi',serif;color:#f1c15a}
nav{display:flex;gap:6px;flex:1;overflow-x:auto;padding:2px}
nav button{background:#ffffff14;border:0;color:#d6e4e8;padding:7px 15px;border-radius:999px;white-space:nowrap;font-weight:500}
nav button.on{background:var(--gold);color:#1b1405;font-weight:700}
header .tools button{background:#ffffff1f;color:#fff;border:0;padding:7px 13px;border-radius:999px}
#bar{display:none;height:3px;background:linear-gradient(90deg,var(--gold),transparent);animation:sl 1s infinite linear;background-size:200% 100%;position:sticky;top:58px;z-index:5}
.busy #bar{display:block}@keyframes sl{to{background-position:-200% 0}}
main{max-width:1180px;margin:0 auto;padding:18px}
section[hidden]{display:none}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,470px);gap:18px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line);box-shadow:0 3px 16px #3a2e140f}
button{font:inherit;cursor:pointer;border:1px solid var(--navy);background:#fff;color:var(--navy);padding:8px 13px;border-radius:10px;transition:.15s}
button:hover{background:#eef5f6}
button.pri,button.hot{background:var(--navy);color:#fff}button.pri:hover{background:var(--navy2)}
button.hot{background:var(--gold);color:#1b1405;border-color:var(--gold);font-weight:700}
button.wide{width:100%;margin-top:10px;padding:12px}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #d99a1f66;border-color:var(--gold)}
input[type=color]{padding:2px;height:38px}input[type=checkbox]{width:auto}
label{display:block;font-size:13.5px;font-weight:700;margin:11px 0 4px;color:#33414f}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.row>*{flex:1}
.meter{margin-bottom:12px;font-size:13px;color:var(--mut)}.meter i{display:block;height:6px;border-radius:9px;background:#eadfca;margin-top:5px;overflow:hidden}.meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#e8c25a);transition:width .4s}
#chatbox{height:56vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.m{max-width:88%;padding:11px 15px;border-radius:16px;line-height:1.9}
.m.a{background:#f4eee0;border:1px solid var(--line);align-self:flex-start;border-top-right-radius:4px}.m.u{background:var(--navy);color:#fff;align-self:flex-end;border-top-left-radius:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fg .chk{display:flex;gap:8px;align-items:center;margin-top:14px}.fg .chk label{margin:0}
.stage{background:#e7dfcf;padding:16px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;border-radius:12px}
.stage>div{box-shadow:0 4px 16px #0004}
#grid{display:flex;flex-wrap:wrap;gap:10px;background:#e7dfcf;padding:14px;border-radius:14px}
.th{box-shadow:0 2px 8px #0004;cursor:pointer;outline:3px solid transparent}.th.on{outline-color:var(--gold)}
.nv{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
#warn{color:#a4161a;font-weight:700}
.ck{list-style:none;padding:0;margin:0}.ck li{padding:7px 0;border-bottom:1px solid #eee6d6}.ck li::before{content:"✓ ";color:#18794e;font-weight:700}.ck li.no::before{content:"✗ ";color:#a4161a}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:60;max-width:90vw}
#ov{position:fixed;inset:0;background:#0b2f39ec;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}#ov[hidden]{display:none}
.ovc{background:var(--card);border-radius:18px;padding:28px;max-width:430px;width:100%;text-align:center}.ovc h3{margin:6px 0}.ovc p{color:var(--mut);margin:4px 0 14px}
.pgb{height:8px;border-radius:9px;background:#eadfca;overflow:hidden}.pgb b{display:block;height:100%;width:0;background:var(--gold);transition:width .5s}
.spin{width:40px;height:40px;border:4px solid #eadfca;border-top-color:var(--navy);border-radius:50%;margin:0 auto 12px;animation:rt 1s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
pre{direction:ltr;text-align:left;background:#f1f3f6;padding:10px;overflow:auto;font-size:12px}
.logo svg,.logo img{width:100%;height:100%;object-fit:contain}
#printRoot{display:none}#meas{display:block;position:absolute;left:-99999px;top:0;visibility:hidden}
</style>
<style id="sc">
.sheet{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--pp);color:var(--ik);font:var(--fs)/var(--lh) var(--ff);text-align:var(--al);flex:none;box-sizing:border-box}
.sheet .in{height:100%;overflow:hidden}.sheet .in>.c{min-height:100%}
.sheet p{margin:0;text-indent:1.3em}.sheet .c>p:first-child,.chh+p,.tp p,.cr p,.dd p{text-indent:0}.cr p,.tp p{margin:0 0 .5em}
.sheet h2{color:var(--pc);font-size:1.7em;line-height:1.4;margin:0 0 .7em;text-align:start}
.hs-rule h2{padding-bottom:.25em;border-bottom:.4mm solid var(--pc)}
.hs-orn h2{text-align:center}.hs-orn h2::after{content:"✦";display:block;font-size:.5em;margin-top:.3em}
.chh{margin:14mm 0 9mm;text-align:center}.cn{display:block;color:var(--pc);font-size:.85em;letter-spacing:.06em;margin-bottom:.3em}.chh h2{text-align:center;margin:0}.chh::after{content:"❖";display:block;color:var(--pc);margin-top:.5em;font-size:.8em}.hs-rule .chh::after,.hs-orn .chh h2::after{content:none}
.bs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;min-height:100%;text-align:center;color:var(--pc);font-size:2em;line-height:2}.bs::before,.bs::after{content:"❁";font-size:.55em;opacity:.7}
.fp{display:flex;flex-direction:column;justify-content:space-between;align-items:center;min-height:100%;text-align:center}.fp .bsm{color:var(--pc);font-size:1.35em;min-height:1.5em}.fp .mid{display:flex;flex-direction:column;align-items:center}.fp .logo{width:26mm;height:26mm;margin-bottom:9mm}.fp h1{color:var(--pc);font-size:2.3em;line-height:1.3;margin:0 0 .4em}.fp .au{margin-top:10mm;font-weight:700}.fp p{text-indent:0;margin:0 0 .5em}.fp .cpy{font-size:.68em;opacity:.8;min-height:1.5em}
.pn{position:absolute;bottom:8mm;left:0;right:0;text-align:center;font-size:.8em;opacity:.7}
.tp,.dd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center}
.tp .logo{width:26mm;height:26mm;margin-bottom:10mm}.tp h1{color:var(--pc);font-size:2.4em;line-height:1.3;margin:0 0 .4em}.tp .au{margin-top:12mm;font-weight:700}
.dd{font-size:1.2em;font-style:italic;padding:0 10mm}
.cr{display:flex;flex-direction:column;justify-content:flex-end;min-height:100%;font-size:.8em;text-align:start}
.tr{display:flex;gap:.5em;align-items:baseline;margin:.35em 0}.tr i{flex:1;border-bottom:1px dotted currentColor;opacity:.5}
.cov::before{content:"";position:absolute;inset:7mm;border:.35mm solid currentColor;opacity:.45;pointer-events:none}
.cov .cin{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:6mm 0}
.cov .logo{width:34mm;height:34mm}.cov .logo.s{width:16mm;height:16mm}
.cov h1{font-size:calc(var(--w)*.085);line-height:1.3;margin:0}.cov .sub{font-size:1.2em;margin:.4em 0 0}.cov .au{font-size:1.3em;font-weight:700;margin:0}
.cov .bl{font-size:1.05em;margin:auto 0}
.pg{box-sizing:border-box;width:calc(var(--w) + var(--b)*2);height:calc(var(--h) + var(--b)*2);padding:var(--b);overflow:hidden}
.spn{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:700 11pt var(--ff);flex:none}
</style>
<style id="pgrule"></style>
<style>
@media print{body>*:not(#printRoot){display:none!important}#printRoot{display:block!important}.pg{break-after:page;page-break-after:always;margin:0}html,body{background:#fff!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header><span class="brand">كتابك</span><nav id="nav"></nav><span class="tools"><button id="undo">↶ تراجع</button></span></header>
<div id="bar"></div>
<main>
<section id="t-chat"><div class="panel">
 <div class="meter"><span id="mt"></span><i><b id="mf"></b></i></div>
 <div id="chatbox"></div>
 <div class="row"><textarea id="msg" rows="2" placeholder="اكتب أو اضغط الميكروفون وتكلم…" style="flex:6"></textarea><button id="mic" style="flex:1">🎙</button><button id="sendb" class="pri" style="flex:1.4">أرسل</button></div>
 <button id="gen" class="wide">✨ اكتب لي الكتاب</button>
 <button id="newc" class="wide">حوار جديد</button>
</div></section>

<section id="t-pages" hidden><div class="cols">
 <div class="panel" style="position:sticky;top:64px">
  <div id="prev" class="stage"></div>
  <div class="nv"><button id="pv">السابقة</button><b id="pinfo"></b><button id="nx">التالية</button></div>
  <div id="warn"></div>
  <label>عنوان الصفحة / الفصل</label><input id="eh">
  <label>نص الصفحة</label><textarea id="et" rows="7"></textarea>
  <label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="em"> مقدمة / خاتمة / فصل خاص (بدون «الفصل رقم»)</label>
  <div class="row"><button id="addp">＋ صفحة بعدها</button><button id="delp">حذف</button><button id="upp">↑</button><button id="dnp">↓</button></div>
  <label>كلّم المحرر عن هذه الصفحة</label>
  <textarea id="pm" rows="2" placeholder="مثلًا: اجعل الفقرة الأولى أقصر وأضف مثالًا من الحياة اليومية"></textarea>
  <div class="row"><select id="scope"><option value="p">هذه الصفحة فقط</option><option value="all">كل الكتاب</option></select><button id="goai" class="pri">نفّذ</button></div>
  <button id="fit" class="wide">ضبط الصفحات تلقائيًا ليتسع النص</button>
 </div>
 <div><div id="empty" class="panel" hidden>لا توجد صفحات بعد. ابدأ بالحوار ثم اضغط «ولّد الكتاب»، أو أضف صفحة يدويًا.</div><div id="grid"></div></div>
</div></section>

<section id="t-design" hidden><div class="cols">
 <div class="panel"><div id="dform" class="fg"></div></div>
 <div class="panel"><div id="dprev" class="stage"></div></div>
</div></section>

<section id="t-cover" hidden><div class="cols">
 <div class="panel">
  <div id="bform"></div><hr>
  <b>الشعار</b>
  <label>وصف الشعار الذي تريده</label><input id="ldesc" placeholder="مثلًا: نخلة بسيطة داخل دائرة بألوان دافئة">
  <div class="fg"><div><label>شكل الشعار السريع</label><select id="lstyle"><option>دائرة</option><option>درع</option><option>معيّن</option><option>كتاب</option></select></div><div><label>لون الشعار</label><input type="color" id="lcol"></div></div>
  <div class="row"><button id="lai" class="pri">🎨 صمّم لي شعارًا</button><button id="lloc">شعار سريع</button></div>
  <div class="row"><label style="flex:1;cursor:pointer;border:1px solid var(--navy);padding:7px;text-align:center;border-radius:4px">ارفع شعارك<input type="file" id="lup" accept="image/*" hidden></label><button id="lrm">إزالة الشعار</button></div>
 </div>
 <div class="panel"><div id="cprev" class="stage"></div></div>
</div></section>

<section id="t-out" hidden><div class="cols">
 <div class="panel"><b>قائمة ما قبل الطباعة</b><ul class="ck" id="chk"></ul>
  <p style="font-size:13px">عند ظهور نافذة الطباعة: الوجهة «حفظ كـ PDF»، الهوامش «بدون»، وفعّل «رسومات الخلفية». الخطوط تُدمج تلقائيًا في الملف.</p></div>
 <div class="panel"><b>التصدير</b>
  <div class="row"><button class="pri" data-p="all">PDF كامل (غلاف + داخل + غلاف خلفي)</button></div>
  <div class="row"><button data-p="in">PDF الداخل فقط</button><button data-p="cover">PDF الغلاف (وجهان)</button></div>
  <div class="row"><button data-p="spread">PDF غلاف مفرود مع الكعب</button></div>
  <div class="row"><button data-x="html">HTML</button><button data-x="md">Markdown</button><button data-x="txt">نص TXT</button></div>
  <div class="row"><button data-x="json">حفظ المشروع</button><label style="flex:1;cursor:pointer;border:1px solid var(--navy);padding:7px;text-align:center;border-radius:4px">فتح مشروع<input type="file" id="lj" accept=".json" hidden></label><button data-x="svg">الشعار SVG</button></div>
 </div>
</div></section>
</main>


<div id="toast"></div><div id="ov" hidden><div class="ovc"><div class="spin"></div><h3 id="ovt"></h3><p id="ovs"></p><div class="pgb"><b id="ovb"></b></div><p style="font-size:12px;margin-top:12px">لا تغلق الصفحة أثناء الكتابة</p></div></div><div id="meas"></div><div id="printRoot"></div>

<script>
const CONFIG={apiKey:'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'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SIZES={'A5':[148,210],'A4':[210,297],'B5':[176,250],'14×21':[140,210],'17×24':[170,240],'جيب 11×18':[110,180]};
const FONTS=['Amiri','Noto Naskh Arabic','Cairo','Tajawal','Reem Kufi','Georgia'];
const FONTURL=document.querySelector('link[href*=fonts]').href;
const DEF={size:'A5',font:'Amiri',fs:13,lh:1.9,align:'justify',dir:'rtl',hs:'rule',primary:'#0f4c5c',paper:'#ffffff',ink:'#1a1a1a',cover:'#0f3d4a',coverInk:'#ffffff',logo:'#e0a526',inner:22,outer:15,top:18,bottom:20,pnum:1,basmala:1,chnum:1,toc:1,copyright:1,dedication:1,pad4:0,bleed:3,gsm:80};
const EB={title:'عنوان الكتاب',subtitle:'',author:'',blurb:'',dedication:'',lang:'العربية',tone:'',logo:'',publisher:'',edition:'الطبعة الأولى',isbn:'',epigraph:'',about:'',pages:[]};
let S={tab:'chat',chat:[],ready:false,book:{...EB},sel:0,ep:{url:'',model:''},d:{...DEF},logoIdea:''},hist=[];
const GREET='أهلًا بيك! 👋 أنا محررك الشخصي، وهنعمل كتابك سوا من أول فكرة لحد ما يبقى جاهز للطباعة. مش مستعجل خالص؛ هسألك أسئلة كتير عشان الكتاب يطلع بصوتك أنت مش بصوت حد تاني. احكيلي بحرية: إيه الفكرة اللي في دماغك؟ حتى لو لسه مش واضحة، ابدأ من أي طرف.';
const SYS_I=`أنت «محرر كتابك»: محرر ومؤلف مشارك دافئ، فضولي، صريح، وعلى قدر عالٍ من الثقافة. تتكلم مع المستخدم كصديق محترف يحب الكتب، وبنفس لغته ولهجته (إن كتب بالمصرية فرد بعربية قريبة منها وواضحة، وإن كتب بالفصحى أو بالإنجليزية فبها).
أسلوبك:
- ردودك غنية ومفصّلة: تعلّق على كلام المستخدم بصدق وعمق في فقرة أو اثنتين، تلتقط الفكرة الجميلة فيه وتسميها، وتقترح 2 أو 3 زوايا أو أفكار محددة يمكن أن تثري الكتاب (عناوين، مشاهد، أمثلة، بنية، نبرة)، ثم تختم بسؤال واحد واضح فقط. لا تكتفِ أبدًا بجملة أو جملتين.
- تقبل أي فكرة عادية بحماس، وتقبل أيضًا الموضوعات الجريئة: رومانسية وعلاقات، صراع وعنف درامي، سياسة ودين وتاريخ حساس، قضايا اجتماعية، أدب مظلم وشخصيات رمادية، سخرية لاذعة. تتعامل معها بنضج وفن دون وعظ ولا استنكار ولا تحذيرات في غير موضعها، ولا تقل «لا أستطيع» لشيء عادي. لا ترفض إلا ما هو إجرامي صريح (جنس مع قاصرين، أو تعليمات عملية لإيذاء حقيقي)، وحينها ترفض بلطف في سطر وتقترح بديلًا قريبًا من هدفه.
- لا تتعجل. تجمع على مهل تفاصيل كثيرة: الفكرة الأساسية، القارئ المستهدف، الهدف من الكتاب، نوعه (رواية، تطوير ذات، دليل، سيرة، شعر…)، النبرة والأسلوب، اللغة، الطول وعدد الفصول، العنوان المبدئي، اسم المؤلف، إن كان يريد مقدمة وإهداء واقتباسًا وبسملة، الألوان والشعور البصري للغلاف، الأفكار والقصص التي لا بد أن تظهر، وما يجب تجنبه.
- لا تقترح بدء الكتابة ولا تضع العلامة [[READY]] إلا بعد أن تغطي معظم ما سبق فعلًا. عندها لخّص كل ما فهمته في نقاط مرتبة واسأل إن كان يريد تعديل أي شيء، فإن أكّد بوضوح فضع العلامة [[READY]] في آخر ردك.
- اكتب نصًا عاديًا فقط: ممنوع الجداول وعلامات ## و ** و | والرموز التنسيقية. للتلخيص استخدم سطورًا قصيرة تبدأ بشرطة.
- لا تذكر أنك ذكاء اصطناعي ولا تتحدث عن نماذج أو مفاتيح.`;
const pg=()=>S.book.pages[S.sel],has=()=>S.book.pages.length>0,rtl=()=>S.d.dir=='rtl';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3500)}
const busy=x=>document.body.classList.toggle('busy',!!x);
const errMsg=e=>/API key|invalid_api_key/i.test(e.message)?'مفتاح الخدمة غير صحيح':(e.message||'حدث خطأ');
function save(){try{localStorage.kt1=JSON.stringify({book:S.book,d:S.d,chat:S.chat,ep:S.ep,ready:S.ready,logoIdea:S.logoIdea})}catch(e){}}
try{const j=JSON.parse(localStorage.kt1||'null');if(j){S.book={...EB,...j.book};S.d={...DEF,...j.d};S.chat=j.chat||[];S.ep=j.ep||S.ep;S.ready=j.ready;S.logoIdea=j.logoIdea||''}}catch(e){}
function snap(){const s=JSON.stringify({b:S.book,d:S.d});if(hist[hist.length-1]!==s)hist.push(s);if(hist.length>40)hist.shift()}
$('#undo').onclick=()=>{const s=hist.pop();if(!s)return toast('لا شيء للتراجع عنه');const o=JSON.parse(s);S.book=o.b;S.d=o.d;S.sel=Math.min(S.sel,Math.max(0,S.book.pages.length-1));refresh();save()};

const MODELS=['openai/gpt-oss-120b','openai/gpt-oss-20b','llama-3.3-70b-versatile','llama-3.1-8b-instant'];
async function ai(system,messages,max=4000,json=0){
 const key=(CONFIG.apiKey||'').trim();let last;

 return`<div><label>${t}</label>${c}</div>`}).join('');dprev()}
function dprev(){const L=inside(),i=Math.max(0,L.findIndex(x=>x.i===S.sel)),x=L[i]||{k:'t'};$('#dprev').innerHTML=`<div style="zoom:${zf(Math.min(400,innerWidth-70))}">${sheet(x,i+1,L)}</div>`}
$('#dform').oninput=e=>{const t=e.target,k=t.dataset.k;if(!k)return;if(t.type=='checkbox')S.d[k]=+t.checked;else S.d[k]=(t.type=='number'||k=='bleed'||k=='gsm')?+t.value:t.value;dprev();save()};
$('#dform').onfocusin=snap;

/* ---------- الغلاف والشعار ---------- */
const BF=[['title','عنوان الكتاب'],['subtitle','عنوان فرعي'],['author','اسم المؤلف'],['blurb','نبذة الغلاف الخلفي','ta'],['dedication','الإهداء','ta'],['publisher','الناشر / دار النشر'],['edition','الطبعة'],['isbn','رقم ISBN (اختياري)'],['epigraph','اقتباس افتتاحي (اختياري)','ta'],['about','نبذة عن المؤلف (تظهر في آخر الكتاب)','ta'],['lang','لغة الكتاب'],['tone','أسلوب الكلام ونبرته']];
function mkLogo(st,ch){const c=S.d.logo,k=S.d.cover,sh={'دائرة':`<circle cx="100" cy="100" r="88" fill="${c}"/>`,'درع':`<path d="M100 12 178 40v52c0 48-33 80-78 96C55 172 22 140 22 92V40z" fill="${c}"/>`,'معيّن':`<rect x="38" y="38" width="124" height="124" rx="14" transform="rotate(45 100 100)" fill="${c}"/>`,'كتاب':`<path d="M18 50q41-18 82 6 41-24 82-6v104q-41-18-82 6-41-24-82-6z" fill="${c}"/>`};
 return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${sh[st]||sh['دائرة']}<text x="100" y="${st=='كتاب'?116:126}" text-anchor="middle" font-size="84" font-family="Amiri,serif" font-weight="700" fill="${k}">${esc(ch)}</text></svg>`}
const clean=s=>s.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi,'').replace(/<image[^>]*>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,'').replace(/javascript:/gi,'');
function drawCover(){$('#bform').innerHTML=BF.map(([k,t,ty])=>`<label>${t}</label>${ty=='ta'?`<textarea rows="3" data-b="${k}">${esc(S.book[k])}</textarea>`:`<input data-b="${k}" value="${esc(S.book[k])}">`}`).join('');$('#ldesc').value=S.logoIdea||'';$('#lcol').value=S.d.logo;cprev()}
function cprev(){const z=zf(Math.min(250,(innerWidth-80)/2));$('#cprev').innerHTML=`<div style="zoom:${z}">${cov('f')}</div><div style="zoom:${z}">${cov('b')}</div>`}
$('#bform').oninput=e=>{const k=e.target.dataset.b;if(!k)return;S.book[k]=e.target.value;cprev();save()};$('#bform').onfocusin=snap;
$('#lcol').oninput=e=>{S.d.logo=e.target.value};
$('#lloc').onclick=()=>{snap();S.d.logo=$('#lcol').value;S.book.logo=mkLogo($('#lstyle').value,(S.book.title||'ك').trim()[0]);cprev();save()};
$('#lai').onclick=async()=>{const q=$('#ldesc').value.trim();S.logoIdea=q;busy(1);
 try{const r=await ai('أنت مصمم شعارات. أعد كود SVG واحدًا فقط (viewBox="0 0 200 200"، أشكال هندسية نظيفة، بلا صور أو خطوط خارجية، والنص إن وُجد بخط Amiri) ولا شيء غيره. الألوان المفضلة: '+S.d.logo+' و '+S.d.cover+'.',[{role:'user',content:(q||'شعار أنيق للكتاب')+' — عنوان الكتاب: '+S.book.title}],3000);
  const m=r.match(/<svg[\s\S]*<\/svg>/i);if(!m)throw new Error('لم يصل شعار صالح، حاول مرة أخرى');snap();S.book.logo=clean(m[0])}catch(e){toast(errMsg(e))}busy(0);cprev();save()};
$('#lup').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{snap();S.book.logo=`<img src="${r.result}" alt="">`;cprev();save()};r.readAsDataURL(f)};
$('#lrm').onclick=()=>{snap();S.book.logo='';cprev();save()};

/* ---------- التصدير ---------- */
function spine(){const th={70:.09,80:.1,100:.125}[S.d.gsm]||.1;return Math.max(2,Math.round((inside().length/2*th+.5)*10)/10)}
function pageRule(m){const [w,h]=SIZES[S.d.size],b=+S.d.bleed,W=m=='spread'?2*w+spine()+2*b:w+2*b;return`@page{size:${W}mm ${h+2*b}mm;margin:0}`}
const pgw=(i,bg)=>`<div class="pg" style="${css()};background:${bg}">${i}</div>`;
function spread(){const d=S.d,sp=spine(),s=`<div class="spn" style="width:${sp}mm;height:var(--h);background:${d.cover};color:${d.coverInk}"><span>${esc(S.book.title)}</span></div>`,o=rtl()?[cov('f'),s,cov('b')]:[cov('b'),s,cov('f')];
 return`<div class="pg" style="${css()};background:${d.cover};width:calc(var(--w)*2 + ${sp}mm + var(--b)*2)"><div style="display:flex;direction:ltr">${o.join('')}</div></div>`}
function printHTML(m){const d=S.d,L=inside(),ins=()=>L.map((x,i)=>pgw(sheet(x,i+1,L),d.paper)).join(''),cf=()=>pgw(cov('f'),d.cover),cb=()=>pgw(cov('b'),d.cover);
 return m=='in'?ins():m=='cover'?cf()+cb():m=='spread'?spread():cf()+ins()+cb()}
function doPrint(m){if(!has())return toast('لا يوجد كتاب بعد');fitAll(1);$('#pgrule').textContent=pageRule(m);$('#printRoot').innerHTML=printHTML(m);setTimeout(()=>print(),150)}
onafterprint=()=>{$('#printRoot').innerHTML=''};
function dl(n,m,c){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:m+';charset=utf-8'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function exportX(k){const b=S.book,n=(b.title||'book').replace(/[\\/:*?"<>|\s]+/g,'-');
 const txt=h=>`${b.title}\n${b.subtitle}\n${b.author}\n\n`+b.pages.map(p=>(p.h?(h?'## ':'')+p.h+'\n\n':'')+p.t).join('\n\n');
 if(k=='md')dl(n+'.md','text/markdown',`# ${b.title}\n\n${b.subtitle?`*${b.subtitle}*\n\n`:''}${b.author?`**${b.author}**\n\n`:''}`+b.pages.map(p=>(p.h?`## ${p.h}\n\n`:'')+p.t).join('\n\n'));
 else if(k=='txt')dl(n+'.txt','text/plain',txt(0));
 else if(k=='json')dl(n+'.ktabak.json','application/json',JSON.stringify({book:b,d:S.d}));
 else if(k=='svg'){if(!b.logo.startsWith('<svg'))return toast('الشعار الحالي ليس SVG');dl(n+'-logo.svg','image/svg+xml',b.logo)}
 else if(k=='html')dl(n+'.html','text/html',`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(b.title)}</title><link href="${FONTURL}" rel="stylesheet"><style>${$('#sc').textContent}body{background:#ccc;margin:0}.pg{margin:12px auto}.logo svg,.logo img{width:100%;height:100%;object-fit:contain}${pageRule('all')}@media print{.pg{margin:0;break-after:page}body{background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>${printHTML('all')}</body></html>`)}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>doPrint(b.dataset.p));
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>has()||b.dataset.x=='svg'?exportX(b.dataset.x):toast('لا يوجد كتاب بعد'));
$('#lj').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);snap();S.book={...EB,...o.book};S.d={...DEF,...o.d};S.sel=0;refresh();save();toast('تم فتح المشروع')}catch(x){toast('ملف غير صالح')}};r.readAsText(f)};
function drawOut(){if(!has()){$('#chk').innerHTML='<li class="no">لا يوجد كتاب بعد. ابدأ من «الحوار».</li>';return}
 const L=inside(),b=S.book,[w,h]=SIZES[S.d.size],over=b.pages.filter(p=>!fits(p)).length;
 const it=[[L.length%4==0,`عدد الصفحات الداخلية ${L.length}${L.length%4?' — ليس من مضاعفات 4، فعّل «إكمال الصفحات» في التصميم':' (مضاعف 4)'}`],[!over,over?`${over} صفحة نصها أطول من المساحة — اضغط «ضبط تلقائي» في الصفحات`:'كل النصوص تتسع في صفحاتها'],[!!(b.title&&b.author),'العنوان واسم المؤلف '+(b.title&&b.author?'مكتملان':'ناقصان')],[!!b.logo,b.logo?'الشعار موجود':'لا يوجد شعار'],[!!b.blurb,b.blurb?'نبذة الغلاف الخلفي موجودة':'نبذة الغلاف الخلفي فارغة'],[1,`المقاس بعد القص ${w}×${h} مم، ومع الـBleed ${w+2*S.d.bleed}×${h+2*S.d.bleed} مم`],[1,`سُمك الكعب التقريبي ${spine()} مم (تأكد منه مع المطبعة)`]];
 $('#chk').innerHTML=it.map(([o,t])=>`<li class="${o?'':'no'}">${t}</li>`).join('')}

/* ---------- عام ---------- */
const TABS=[['chat','١ الحوار'],['pages','٢ الصفحات'],['design','٣ التصميم'],['cover','٤ الغلاف والشعار'],['out','٥ التصدير']];
function refresh(){$('#nav').innerHTML=TABS.map(([k,t])=>`<button data-t="${k}" class="${S.tab==k?'on':''}">${t}</button>`).join('');
 document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!='t-'+S.tab);({chat:drawChat,pages:drawPages,design:drawDesign,cover:drawCover,out:drawOut})[S.tab]()}
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;refresh()}};


refresh();
</script>
</body>
</html>
